components:
  schemas:
    AdminCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: نام دسته‌بندی
          maxLength: 120
        slug:
          type: string
          title: شناسه URL
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        parent:
          type: integer
          nullable: true
        parent_name:
          type: string
          readOnly: true
        icon:
          type: string
          title: نام آیکن
          maxLength: 60
        is_active:
          type: boolean
          title: فعال
        sort_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: ترتیب
      required:
      - id
      - name
      - parent_name
      - slug
    AdminCity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: نام شهر
          maxLength: 100
        slug:
          type: string
          title: شناسه URL
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        is_active:
          type: boolean
          title: فعال
      required:
      - id
      - name
      - slug
    AdminDashboard:
      type: object
      properties:
        users:
          type: integer
        salons:
          type: integer
        pending_salons:
          type: integer
        approved_salons:
          type: integer
        branches:
          type: integer
        services:
          type: integer
      required:
      - approved_salons
      - branches
      - pending_salons
      - salons
      - services
      - users
    AdminDistrict:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        city:
          type: integer
        city_name:
          type: string
          readOnly: true
        name:
          type: string
          title: نام منطقه
          maxLength: 100
        slug:
          type: string
          title: شناسه URL
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        is_active:
          type: boolean
          title: فعال
      required:
      - city
      - city_name
      - id
      - name
      - slug
    AvailableSlot:
      type: object
      properties:
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        staff_id:
          type: integer
        staff_name:
          type: string
        total_price:
          type: integer
        duration_minutes:
          type: integer
      required:
      - duration_minutes
      - end_at
      - staff_id
      - staff_name
      - start_at
      - total_price
    Booking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
          readOnly: true
        branch:
          type: integer
          readOnly: true
        branch_name:
          type: string
          readOnly: true
        salon_name:
          type: string
          readOnly: true
        staff:
          type: integer
          readOnly: true
        staff_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
        start_at:
          type: string
          format: date-time
          readOnly: true
        end_at:
          type: string
          format: date-time
          readOnly: true
        total_price:
          type: integer
          readOnly: true
        deposit_amount:
          type: integer
          readOnly: true
        discount_code:
          type: integer
          readOnly: true
          nullable: true
        discount_amount:
          type: integer
          readOnly: true
        paid_amount:
          type: integer
          readOnly: true
        remaining_amount:
          type: integer
          readOnly: true
        notes:
          type: string
          readOnly: true
        hold_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancellation_reason:
          type: string
          readOnly: true
        checked_in_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        checked_in_by:
          type: integer
          readOnly: true
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingItem'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - branch
      - branch_name
      - cancellation_reason
      - cancelled_at
      - checked_in_at
      - checked_in_by
      - created_at
      - customer
      - deposit_amount
      - discount_amount
      - discount_code
      - end_at
      - hold_expires_at
      - id
      - items
      - notes
      - paid_amount
      - remaining_amount
      - salon_name
      - source
      - staff
      - staff_name
      - start_at
      - status
      - status_label
      - total_price
    BookingItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        branch_service:
          type: integer
        service_name:
          type: string
          readOnly: true
        staff:
          type: integer
        staff_name:
          type: string
          readOnly: true
        price:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        duration_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - branch_service
      - duration_minutes
      - id
      - price
      - service_name
      - staff
      - staff_name
    BookingStatusEnum:
      enum:
      - pending_payment
      - awaiting_verification
      - confirmed
      - completed
      - cancelled
      - no_show
      type: string
      description: |-
        * `pending_payment` - در انتظار پرداخت
        * `awaiting_verification` - در انتظار تأیید واریز
        * `confirmed` - تأییدشده
        * `completed` - انجام‌شده
        * `cancelled` - لغوشده
        * `no_show` - عدم حضور
    Branch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        salon:
          type: integer
        salon_name:
          type: string
          readOnly: true
        name:
          type: string
