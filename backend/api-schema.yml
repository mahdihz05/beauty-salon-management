  /api/admin-panel/salons/:
    get:
      operationId: admin_panel_salons_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: کدام فیلد باید هنگام مرتب‌سازی نتایج استفاده شود.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: یک عبارت جستجو.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: وضعیت
          enum:
          - approved
          - draft
          - pending
          - rejected
          - suspended
        description: |-
          * `draft` - پیش‌نویس
          * `pending` - در انتظار بررسی
          * `approved` - تأییدشده
          * `rejected` - ردشده
          * `suspended` - تعلیق‌شده
      - in: query
        name: type
        schema:
          type: string
          title: نوع سالن
          enum:
          - men
          - unisex
          - women
        description: |-
          * `women` - زنانه
          * `men` - مردانه
          * `unisex` - مشترک
